name: Direct MCP regression
on:
  push:
    branches: [direct-mcp-ci-validation]
  pull_request:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  regression:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - run: npm ci
      - run: npm run build:check
      - run: npm run test:regulation-fixes
      - run: npm run test:tables
      - run: npm run test:delegation-response
      - name: R2 6th-fix acceptance on real ALIO documents
        run: npm run test:r2-sixth-live
      - if: always()
        uses: actions/upload-artifact@v4
        with:
          name: r2-sixth-live
          path: reports/r2-sixth-live.json
          if-no-files-found: ignore
