name: table-structure-sample

on:
  pull_request:
    branches: [main]
    paths:
      - "scripts/table-sample.mjs"
      - "scripts/delegation-response-regression.ts"
      - "scripts/test-loader.mjs"
      - ".github/workflows/table-structure-sample.yml"
      - "package.json"
      - "package-lock.json"
      - "src/**"

jobs:
  sample:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "24"
      - run: npm ci --ignore-scripts
      - run: node scripts/table-sample.mjs
      - run: npm run test:delegation-response
      - run: npx wrangler deploy --dry-run --outdir /tmp/add-regulations-mcp-dry-run
