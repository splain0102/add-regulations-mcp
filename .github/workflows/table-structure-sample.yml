name: table-structure-sample

on:
  pull_request:
    branches: [main]
    paths:
      - "scripts/**"
      - ".github/workflows/table-structure-sample.yml"
      - "package.json"
      - "package-lock.json"
      - "src/**"

jobs:
  sample:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "24"
      - run: npm ci --ignore-scripts
      - run: node scripts/table-sample.mjs
      - id: comprehensive
        run: node --use-env-proxy --import ./scripts/test-loader.mjs scripts/comprehensive-regression.ts
      - name: second validation acceptance
        run: npm run test:second-acceptance
      - name: second-fixes regression
        run: npm run test:second-fixes
      - name: third-fixes regression
        run: npm run test:third-fixes
      - if: always()
        uses: actions/upload-artifact@v4
        with:
          name: comprehensive-regression
          path: |
            reports/comprehensive-regression.json
            reports/second-fixes-regression.json
            reports/second-validation-acceptance.json
            reports/third-fixes-regression.json
          if-no-files-found: ignore
      - run: npx wrangler deploy --dry-run --outdir /tmp/add-regulations-mcp-dry-run
