name: table-structure-sample

on:
  pull_request:
    branches: [main]
    paths:
      - "scripts/table-sample.mjs"
      - ".github/workflows/table-structure-sample.yml"
      - "package.json"

jobs:
  sample:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
      - run: npm install --ignore-scripts
      - run: node scripts/table-sample.mjs
