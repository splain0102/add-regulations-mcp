name: A corpus index
on:
  pull_request:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
  id-token: write
concurrency:
  group: corpus-index-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true
jobs:
  index:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
      - run: npm ci
      - name: Verify actual GitHub OIDC issuer and workflow identity claims
        run: node scripts/github-oidc-ci-probe.mjs
      - run: npm run typecheck:corpus-index
      - run: npm run build:check
      - run: npm run test:corpus-index
      - run: npm run test:offline-index
      - name: Verify interrupted collection and bounded outage recovery
        run: node --import ./scripts/test-loader.mjs scripts/live-corpus-recovery-regression.ts
      - run: npm run test:corpus-workers
      - name: Restore recent raw ALIO downloads for this PR
        id: raw-cache
        uses: actions/cache/restore@v4
        with:
          path: reports/corpus-index-live-files
          key: alio-raw-v1-${{ github.event.pull_request.number || github.ref_name }}-${{ hashFiles('src/regulation-core/**', 'package-lock.json') }}-${{ github.run_id }}-${{ github.run_attempt }}
          restore-keys: |
            alio-raw-v1-${{ github.event.pull_request.number || github.ref_name }}-${{ hashFiles('src/regulation-core/**', 'package-lock.json') }}-
      - name: Actual ALIO whole-corpus acceptance
        run: npm run test:corpus-acceptance
      - name: Preserve raw downloads even when ALIO becomes unavailable
        if: always() && steps.raw-cache.outcome == 'success'
        uses: actions/cache/save@v4
        with:
          path: reports/corpus-index-live-files
          key: ${{ steps.raw-cache.outputs.cache-primary-key }}
      - name: Exact document evidence and no request-time parsing
        run: node --use-env-proxy --import ./scripts/test-loader.mjs scripts/indexed-document-regression.ts
      - name: OAuth MCP document queries against persistent index
        run: npm run test:corpus-workers
        env:
          DOCUMENT_INDEX_FIXTURE: reports/indexed-document-fixture.json
      - name: Offline incremental rebuild of current ALIO snapshot (no production publish)
        run: npm run test:offline-build
        env:
          OFFLINE_CHECKPOINT: reports/corpus-index-live-checkpoint.json
      - name: Fourth correction live acceptance (N5 N6 cross attachments)
        run: npm run test:fourth-fixes
        env:
          FOURTH_CHECKPOINT: reports/corpus-index-live-checkpoint.json
          FOURTH_USE_ACCEPTED_LIST: 'true'
          FOURTH_USE_ACCEPTED_HTTP: 'true'
      - name: Export verified initial corpus for administrator bootstrap
        run: node scripts/bootstrap-index.mjs export
      - name: Cold search equivalence and bounded KV performance
        run: npm run test:corpus-performance
      - name: Authenticated search of actual ALIO corpus in workerd KV
        run: npm run test:corpus-workers
        env:
          CORPUS_LIVE_CHECKPOINT: reports/corpus-index-live-checkpoint.json
      - if: always()
        uses: actions/upload-artifact@v4
        with:
          name: A-corpus-index-evidence
          path: |
            reports/corpus-index-regression.json
            reports/corpus-index-workers.json
            reports/corpus-index-acceptance.json
            reports/corpus-index-bootstrap.json
            reports/corpus-index-performance.json
            reports/fourth-fixes-regression.json
            reports/offline-index-result.json
            reports/offline-index-regression.json
            reports/oidc-ci-probe.json
            reports/live-corpus-recovery-regression.json
          if-no-files-found: ignore

