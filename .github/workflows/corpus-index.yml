name: A corpus index
on:
  pull_request:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
  id-token: write
jobs:
  index:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
      - run: npm ci
      - name: Verify actual GitHub OIDC issuer and workflow identity claims
        run: node scripts/github-oidc-ci-probe.mjs
      - run: npm run typecheck:corpus-index
      - run: npm run build:check
      - run: npm run test:corpus-index
      - run: npm run test:offline-index
      - run: npm run test:corpus-workers
      - name: Actual ALIO whole-corpus acceptance
        run: npm run test:corpus-acceptance
      - name: Offline incremental rebuild of current ALIO snapshot (no production publish)
        run: npm run test:offline-build
        env:
          OFFLINE_CHECKPOINT: reports/corpus-index-live-checkpoint.json
      - name: Fourth correction live acceptance (N5 N6 cross attachments)
        run: npm run test:fourth-fixes
        env:
          FOURTH_CHECKPOINT: reports/corpus-index-live-checkpoint.json
          FOURTH_USE_ACCEPTED_LIST: 'true'
      - name: Export verified initial corpus for administrator bootstrap
        run: node scripts/bootstrap-index.mjs export
      - name: Cold search equivalence and bounded KV performance
        run: npm run test:corpus-performance
      - name: Authenticated search of actual ALIO corpus in workerd KV
        run: npm run test:corpus-workers
        env:
          CORPUS_LIVE_CHECKPOINT: reports/corpus-index-live-checkpoint.json
      - if: always()
        uses: actions/upload-artifact@v4
        with:
          name: A-corpus-index-evidence
          path: |
            reports/corpus-index-regression.json
            reports/corpus-index-workers.json
            reports/corpus-index-acceptance.json
            reports/corpus-index-bootstrap.json
            reports/corpus-index-performance.json
            reports/fourth-fixes-regression.json
            reports/offline-index-result.json
            reports/offline-index-regression.json
            reports/oidc-ci-probe.json
          if-no-files-found: ignore
