name: Temporary ADD C0345 API probe
on:
  push:
    branches:
      - tmp-alio-public-download-20261008
    paths:
      - scripts/tmp_alio_c0345_api_probe.py
      - .github/workflows/tmp-alio-c0345-download.yml
  workflow_dispatch:

jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - name: Install deps
        run: python -m pip install --upgrade requests beautifulsoup4
      - name: Probe ALIO C0345 JSON API
        run: python scripts/tmp_alio_c0345_api_probe.py
