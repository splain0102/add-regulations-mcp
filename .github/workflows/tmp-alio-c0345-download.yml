name: Temporary ADD C0345 fast attachment download
on:
  push:
    branches:
      - tmp-alio-public-download-20261008
    paths:
      - scripts/tmp_alio_c0345_fast_download.py
      - .github/workflows/tmp-alio-c0345-download.yml
  workflow_dispatch:

jobs:
  download:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - name: Install deps
        run: python -m pip install --upgrade requests
      - name: Download verified ADD original attachments
        run: python scripts/tmp_alio_c0345_fast_download.py
      - name: Show result
        if: always()
        run: |
          find alio_c0345_fast -maxdepth 3 -type f -printf '%p %s bytes\n' | sort || true
          echo "---- result ----"
          cat alio_c0345_fast/다운로드_결과.txt || true
      - name: Upload artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: add-c0345-fast-files
          path: alio_c0345_fast/
          if-no-files-found: warn
          retention-days: 7
