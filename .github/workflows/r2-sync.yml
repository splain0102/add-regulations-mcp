name: R2 hourly regulation sync
on:
  push:
    branches: [main]
    paths:
      - 'scripts/r2/**'
      - 'scripts/d1/collect.ts'
      - 'scripts/d1/records.ts'
      - 'scripts/d1/remote.ts'
      - 'src/r2/**'
      - '.github/workflows/r2-sync.yml'
  schedule:
    - cron: '37 * * * *'
  workflow_dispatch:
    inputs:
      force_sha:
        description: Force raw attachment verification
        type: boolean
        default: false
permissions:
  contents: read
concurrency:
  group: add-r2-sync-production
  cancel-in-progress: false
jobs:
  sync:
    if: github.ref == 'refs/heads/main' && vars.R2_BUCKET != ''
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version: '24'
          cache: npm
      - run: npm ci
      - name: Collect changed files, validate and atomically publish R2 index
        run: npm run sync:r2
        env:
          CLOUDFLARE_ACCOUNT_ID: ${{ vars.CLOUDFLARE_ACCOUNT_ID }}
          R2_BUCKET: ${{ vars.R2_BUCKET }}
          R2_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
          R2_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
          R2_FORCE_SHA: ${{ inputs.force_sha == true && 'true' || 'false' }}
