name: D1 preindexed MCP regression
on:
  pull_request:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  d1:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
      - run: npm ci
      - run: npm run typecheck:d1
      - run: npm run build:d1
      - run: npm run test:d1
      - if: always()
        uses: actions/upload-artifact@v4
        with:
          name: d1-regression-evidence
          path: reports/d1-*.json
