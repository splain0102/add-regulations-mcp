name: Temporary ADD external audit attachments
on:
  push:
    branches:
      - tmp-alio-public-download-20261008
    paths:
      - scripts/tmp_external_audit_c0345.py
      - .github/workflows/tmp-external-audit-c0345.yml
  workflow_dispatch:
jobs:
  download:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - run: python -m pip install --upgrade requests
      - run: python scripts/tmp_external_audit_c0345.py
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: add-c0345-external-audit
          path: external_audit_c0345/
          if-no-files-found: warn
          retention-days: 7
