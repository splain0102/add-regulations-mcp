name: R2 preindexed MCP regression
on:
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  r2:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version: '24'
          cache: npm
      - run: npm ci
      - run: npm run typecheck:r2
      - run: npm run build:r2
      - run: npm run test:r2
      - run: node --import ./scripts/test-loader.mjs scripts/d1/remote-regression.ts
      - if: always()
        uses: actions/upload-artifact@v4
        with:
          name: r2-regression
          path: reports/r2-regression.json
          if-no-files-found: ignore
