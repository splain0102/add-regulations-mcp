name: pdf-layout-table-sample

on:
  pull_request:
    branches: [main]
    paths:
      - "scripts/pdf-table-sample.mjs"
      - ".github/workflows/pdf-layout-table-sample.yml"
      - "src/**"
      - "package.json"

jobs:
  sample:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - run: npm install --ignore-scripts
      - run: node scripts/pdf-table-sample.mjs
      - run: npx wrangler deploy --dry-run --outdir /tmp/add-regulations-mcp-pdf-dry-run
